<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#b3261e">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Germany Wins WWI — Timeline</title>
<style>
:root{--bg:#f6f4ef;--card:#fff;--tx:#1d1d1b;--mut:#6b6a64;--ac:#b3261e;--bd:#d9d5ca;--in:#faf9f5;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#17171a;--card:#222226;--tx:#ececea;--mut:#9a9a94;--ac:#ff6b5e;--bd:#38383d;--in:#1a1a1d}}
:root[data-theme="dark"]{--bg:#17171a;--card:#222226;--tx:#ececea;--mut:#9a9a94;--ac:#ff6b5e;--bd:#38383d;--in:#1a1a1d}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
header{display:flex;gap:10px;align-items:center;justify-content:space-between;padding:14px 16px;flex-wrap:wrap}
h1{font-size:18px;margin:0}
button{font:inherit;cursor:pointer;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:8px;padding:6px 12px}
button.p{background:var(--ac);border-color:var(--ac);color:#fff}
button.s{padding:3px 8px;font-size:13px;color:var(--mut)}
#scroll{overflow-x:auto;padding:20px 16px 40px;-webkit-overflow-scrolling:touch}
#track{display:flex;gap:0;align-items:flex-start;position:relative;width:max-content;min-height:300px}
#track:before{content:"";position:absolute;left:0;right:0;top:38px;height:3px;background:var(--bd)}
.it{width:300px;flex:none;padding-right:18px;position:relative;padding-top:0}
.dot{width:16px;height:16px;border-radius:50%;background:var(--ac);border:3px solid var(--bg);position:relative;top:31px;z-index:1;margin-left:2px}
.yr{margin-top:42px;font-weight:700;color:var(--ac);font-size:20px}
.cd{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px;margin-top:6px}
.cd h3{margin:0 0 6px;font-size:16px}
.cd p{margin:0 0 8px;white-space:pre-wrap;color:var(--tx)}
.cd img{width:100%;border-radius:8px;display:block;margin:0 0 8px}
.lk a{display:block;color:var(--ac);word-break:break-all;margin-top:2px}
.tb{display:flex;gap:4px;margin-top:8px;flex-wrap:wrap}
input,textarea{width:100%;font:inherit;background:var(--in);color:var(--tx);border:1px solid var(--bd);border-radius:8px;padding:7px;margin:0 0 6px}
textarea{min-height:70px;resize:vertical}
label{font-size:12px;color:var(--mut)}
.add{width:120px;flex:none;padding-top:24px}
.hint{padding:0 16px;color:var(--mut);font-size:13px}
@media print{
:root{--bg:#fff;--card:#fff;--tx:#000;--mut:#444;--ac:#b3261e;--bd:#ccc;padding:0}
header>div,.hint,.tb,.add,.dot,#track:before{display:none!important}
header{padding:0 0 10px}
#scroll{overflow:visible;padding:0}
#track{display:block;width:auto;min-height:0}
.it{width:100%;padding:0;margin-bottom:14px;break-inside:avoid;page-break-inside:avoid}
.yr{margin-top:0}
.cd img{max-width:420px}
}
</style>
</head>
<body>
<header>
<h1>Germany Wins WWI</h1>
<div><button id="pdf" class="s">PDF</button> <button id="doc" class="s">Document</button> <button id="theme" class="s">Theme</button> <button id="reset" class="s">Reset</button> <button id="addEnd" class="p">+ Event</button></div>
</header>
<div class="hint">Scroll sideways. Tap Edit on any event to change text, add a picture or links.</div>
<div id="scroll"><div id="track"></div></div>
<script>
var KEY="tl_germany_v1";
var DEF=[
["1914","Schlieffen Plan succeeds","The Marne goes Germany's way and Paris falls by October."],
["1915","France sues for peace","Britain, with its navy intact, fights on at sea."],
["1916","Treaty of Brussels","U-boats and the blockade force peace. Germany takes colonies, the Briey-Longwy iron basin, and Mitteleuropa, a German-led economic bloc."],
["1917","Russia collapses anyway","Germany backs a puppet government; Lenin's return is blocked or delayed."],
["1918","Kaiser stays","Wilhelm II keeps the throne; Hindenburg and Ludendorff hold heavy influence."],
["1919–1920s","No Versailles","No hyperinflation grievance. Economy booms on reparations and colonial resources; the Reichstag gains power."],
["1929","Depression cushioned","The Great Depression still hits, but the German bloc softens it. Hitler stays a fringe figure."],
["1930s","Naval arms race","Germany and Britain rival for global influence."],
["1940s","Cold war, no WWII","Mitteleuropa vs. the British Empire/US. No Holocaust."],
["1960s–80s","Gradual liberalization","Colonial independence movements shake both empires."]
];
function mk(a){return {id:Math.random().toString(36).slice(2),yr:a[0],t:a[1],d:a[2],img:"",links:[]}}
var data,editing=null;
function load(){try{var s=localStorage.getItem(KEY);if(s)return JSON.parse(s)}catch(e){}return DEF.map(mk)}
function save(){try{localStorage.setItem(KEY,JSON.stringify(data))}catch(e){alert("Storage full — try smaller or fewer pictures.")}}
data=load();
function esc(s){return String(s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
function safe(u){u=(u||"").trim();if(!/^https?:\/\//i.test(u))u="https://"+u;try{var x=new URL(u);return /^https?:$/.test(x.protocol)?x.href:""}catch(e){return ""}}
function linksToText(l){return l.map(function(k){return k.l+" | "+k.u}).join("\n")}
function textToLinks(t){return t.split("\n").map(function(r){r=r.trim();if(!r)return null;var p=r.split("|");var u=safe(p.length>1?p.slice(1).join("|"):p[0]);if(!u)return null;return {l:(p.length>1?p[0].trim():"")||u,u:u}}).filter(Boolean)}
function render(){
var h="";
data.forEach(function(e,i){
h+='<div class="it" data-i="'+i+'"><div class="dot"></div>';
if(editing===e.id){
h+='<div class="yr">&nbsp;</div><div class="cd"><label>Date</label><input id="ey" value="'+esc(e.yr)+'"><label>Title</label><input id="et" value="'+esc(e.t)+'"><label>Description</label><textarea id="ed">'+esc(e.d)+'</textarea>'
+'<label>Picture</label><input type="file" id="ef" accept="image/*">'
+(e.img?'<img src="'+e.img+'" alt=""><button class="s" data-a="rmimg">Remove picture</button>':'')
+'<label>Links (one per line: Label | https://...)</label><textarea id="el">'+esc(linksToText(e.links))+'</textarea>'
+'<div class="tb"><button class="p" data-a="ok">Done</button></div></div>';
}else{
h+='<div class="yr">'+esc(e.yr)+'</div><div class="cd"><h3>'+esc(e.t)+'</h3>'
+(e.img?'<img src="'+e.img+'" alt="">':'')
+(e.d?'<p>'+esc(e.d)+'</p>':'')
+(e.links.length?'<div class="lk">'+e.links.map(function(k){return '<a href="'+esc(k.u)+'" target="_blank" rel="noopener noreferrer">'+esc(k.l)+'</a>'}).join("")+'</div>':'')
+'<div class="tb"><button class="s" data-a="edit">Edit</button><button class="s" data-a="l">◀</button><button class="s" data-a="r">▶</button><button class="s" data-a="ins">+ After</button><button class="s" data-a="del">Delete</button></div></div>';
}
h+='</div>';
});
h+='<div class="add"><div class="dot"></div><div class="yr">&nbsp;</div><button data-a="end">+ Event</button></div>';
document.getElementById("track").innerHTML=h;
}
function grab(e){
e.yr=document.getElementById("ey").value;e.t=document.getElementById("et").value;e.d=document.getElementById("ed").value;
e.links=textToLinks(document.getElementById("el").value);
}
function addAt(i){var n=mk(["Year","New event",""]);data.splice(i,0,n);editing=n.id;save();render();
var el=document.querySelector('[data-i="'+i+'"]');if(el)el.scrollIntoView({inline:"center",block:"nearest"})}
document.getElementById("track").addEventListener("click",function(ev){
var b=ev.target.closest("button");if(!b)return;
var a=b.dataset.a;if(a==="end")return addAt(data.length);
var it=b.closest(".it");var i=+it.dataset.i;var e=data[i];
if(editing&&editing!==e.id&&a!=="ok"){var cur=data.find(function(x){return x.id===editing});if(cur&&document.getElementById("ey"))grab(cur)}
if(a==="edit")editing=e.id;
else if(a==="ok"){grab(e);editing=null}
else if(a==="rmimg"){grab(e);e.img=""}
else if(a==="del"){if(!confirm("Delete this event?"))return;data.splice(i,1);editing=null}
else if(a==="l"&&i>0){data.splice(i-1,0,data.splice(i,1)[0])}
else if(a==="r"&&i<data.length-1){data.splice(i+1,0,data.splice(i,1)[0])}
else if(a==="ins")return addAt(i+1);
save();render();
});
document.getElementById("track").addEventListener("change",function(ev){
if(ev.target.id!=="ef")return;
var f=ev.target.files[0];if(!f)return;
var e=data.find(function(x){return x.id===editing});grab(e);
var r=new FileReader();
r.onload=function(){var im=new Image();im.onload=function(){
var m=700,s=Math.min(1,m/Math.max(im.width,im.height));
var c=document.createElement("canvas");c.width=Math.round(im.width*s);c.height=Math.round(im.height*s);
c.getContext("2d").drawImage(im,0,0,c.width,c.height);
e.img=c.toDataURL("image/jpeg",0.78);save();render()};im.src=r.result};
r.readAsDataURL(f);
});
document.getElementById("addEnd").onclick=function(){addAt(data.length)};
document.getElementById("reset").onclick=function(){if(confirm("Reset to the original timeline? Your edits will be lost.")){data=DEF.map(mk);editing=null;save();render()}};
document.getElementById("theme").onclick=function(){var r=document.documentElement,d=r.dataset.theme==="dark"||(!r.dataset.theme&&matchMedia("(prefers-color-scheme:dark)").matches);r.dataset.theme=d?"light":"dark"};
document.getElementById("pdf").onclick=function(){editing=null;render();setTimeout(function(){window.print()},100)};
document.getElementById("doc").onclick=function(){
var t=document.querySelector("h1").textContent;
var b='<html xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:w="urn:schemas-microsoft-com:office:word"><head><meta charset="utf-8"><title>'+esc(t)+'</title></head><body><h1>'+esc(t)+'</h1>';
data.forEach(function(e){
b+='<h2>'+esc(e.yr)+' — '+esc(e.t)+'</h2>';
if(e.img)b+='<p><img src="'+e.img+'" width="420"></p>';
if(e.d)b+='<p>'+esc(e.d).replace(/\n/g,"<br>")+'</p>';
e.links.forEach(function(k){b+='<p><a href="'+esc(k.u)+'">'+esc(k.l)+'</a></p>'});
});
b+='</body></html>';
var a=document.createElement("a");a.href=URL.createObjectURL(new Blob(["\ufeff"+b],{type:"application/msword"}));
a.download="timeline.doc";document.body.appendChild(a);a.click();document.body.removeChild(a);
setTimeout(function(){URL.revokeObjectURL(a.href)},3000)};
render();
if("serviceWorker" in navigator){window.addEventListener("load",function(){navigator.serviceWorker.register("sw.js").catch(function(){})})}
</script>
</body>
</html>
