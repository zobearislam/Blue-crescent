<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 240" width="200" height="240">
  <!-- Ornate-style circular frame -->
  <circle cx="100" cy="130" r="88" fill="none" stroke="#d4af37" stroke-width="8"/>
  <circle cx="100" cy="130" r="78" fill="#ffd700" stroke="#c9a227" stroke-width="3"/>
  <!-- Blue crescent, slightly off-center left -->
  <path d="M 108 70 A 48 48 0 1 0 108 190 A 36 36 0 1 1 108 70 Z" fill="#0087cc"/>
  <!-- Simple crown on top -->
  <g transform="translate(100,42)">
    <path d="M -28 0 L -18 -22 L -6 -8 L 0 -26 L 6 -8 L 18 -22 L 28 0 Z" fill="#d4af37" stroke="#b8860b" stroke-width="1.5"/>
    <rect x="-30" y="0" width="60" height="8" rx="2" fill="#d4af37" stroke="#b8860b" stroke-width="1"/>
    <circle cx="0" cy="-26" r="5" fill="#0087cc"/>
    <circle cx="0" cy="-32" r="3" fill="#fff"/>
  </g>
  <!-- Small decorative gems around the circle -->
  <circle cx="40" cy="100" r="5" fill="#0087cc"/>
  <circle cx="160" cy="100" r="5" fill="#0087cc"/>
  <circle cx="50" cy="160" r="5" fill="#0087cc"/>
  <circle cx="150" cy="160" r="5" fill="#0087cc"/>
  <circle cx="100" cy="195" r="5" fill="#0087cc"/>
</svg>