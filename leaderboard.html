<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Leaderboard — Blue Crescent</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--blue:#89cff0;--red:#f4a6a6;--ink:#1f3a5f;--soft:#5d7391;--line:#d6e3f0}
*{box-sizing:border-box}body{margin:0;font:16px/1.5 system-ui,-apple-system,Segoe UI,sans-serif;color:var(--ink);background:repeating-conic-gradient(var(--blue) 0% 25%,var(--red) 0% 50%) 0 0/56px 56px;min-height:100vh}
header{background:#fff;border-bottom:3px solid var(--ink);padding:14px 18px;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}a{color:var(--ink);font-weight:800}
main{max-width:820px;margin:26px auto;padding:0 14px 40px}.card{background:#fff;border:3px solid var(--ink);border-radius:20px;padding:22px;box-shadow:0 5px 0 var(--ink)}
h1{margin:0 0 4px;font-size:1.8rem}.muted{color:var(--soft)}#status{margin:12px 0;font-weight:800}
table{width:100%;border-collapse:collapse;margin-top:14px}th,td{text-align:left;padding:12px 8px;border-bottom:2px solid var(--line)}th{font-size:.85rem;color:var(--soft)}td:first-child,th:first-child{width:55px}.player{display:flex;align-items:center;gap:10px;min-width:0}.avatar{width:38px;height:38px;border-radius:50%;object-fit:cover;background:var(--blue);flex:none}.name{font-weight:900;overflow-wrap:anywhere}.you{font-size:.75rem;background:var(--blue);border-radius:99px;padding:2px 7px;margin-left:5px}
tr:nth-child(1) td:first-child{font-size:1.3rem}tr:nth-child(2) td:first-child{font-size:1.15rem}
@media(max-width:520px){.card{padding:14px}th,td{padding:10px 4px;font-size:.9rem}.hide-mobile{display:none}.avatar{width:32px;height:32px}}
</style>
</head>
<body>
<header><strong>🌙 Blue Crescent</strong><nav><a href="index.html">Lessons</a> · <a href="profile.html">My Profile</a> · <a href="games.html">Games</a></nav></header>
<main><section class="card">
<h1>🏆 Learner leaderboard</h1><p class="muted">Ranked by XP. Complete quizzes to earn 10 XP each.</p>
<div id="status" role="status">Loading leaderboard…</div>
<table><thead><tr><th>#</th><th>Learner</th><th>XP</th><th class="hide-mobile">Quizzes</th><th class="hide-mobile">Streak</th></tr></thead><tbody id="rows"></tbody></table>
<p class="muted">Only display names and aggregate learning stats are shown here. Be kind and keep learning!</p>
</section></main>
<script>
(function(){
var sb=window.supabase.createClient('https://qdviglvmnqhdamymfwhs.supabase.co','sb_publishable_uS1vL0jWipIXHYhL68fm1A_gBAenhXv');
var $=function(id){return document.getElementById(id)};
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function avatar(u){return u||'data:image/svg+xml;charset=UTF-8,'+encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><rect width="100" height="100" rx="50" fill="#89cff0"/><text x="50" y="66" text-anchor="middle" font-size="58">🌙</text></svg>')}
async function load(){
var session=await sb.auth.getSession(), me=session.data.session&&session.data.session.user;
var r=await sb.from('leaderboard_stats').select('user_id,xp,lessons_completed,streak,updated_at').order('xp',{ascending:false}).order('lessons_completed',{ascending:false}).limit(100);
if(r.error){$('status').textContent='Could not load leaderboard: '+r.error.message;return}
if(!r.data.length){$('status').textContent='No scores yet. Sign in, finish a quiz, and be the first on the board!';return}
var ids=r.data.map(function(x){return x.user_id});
var pr=await sb.from('profiles').select('user_id,display_name,avatar_url').in('user_id',ids);
if(pr.error){$('status').textContent='Could not load learner names: '+pr.error.message;return}
var profiles={};(pr.data||[]).forEach(function(p){profiles[p.user_id]=p});
var sorted=r.data.slice().sort(function(a,b){return b.xp-a.xp||b.lessons_completed-a.lessons_completed});
$('status').textContent='Showing '+sorted.length+' learner'+(sorted.length===1?'':'s')+'.';
$('rows').innerHTML=sorted.map(function(s,i){
var p=profiles[s.user_id]||{},name=p.display_name||'Moon learner',isMe=me&&me.id===s.user_id;
return '<tr><td>'+(i===0?'🥇':i===1?'🥈':i===2?'🥉':i+1)+'</td><td><div class="player"><img class="avatar" src="'+esc(avatar(p.avatar_url))+'" alt="" onerror="this.onerror=null;this.src=\''+esc(avatar(''))+'\'"><span class="name">'+esc(name)+(isMe?' <span class="you">YOU</span>':'')+'</span></div></td><td><strong>'+Number(s.xp||0).toLocaleString()+'</strong></td><td class="hide-mobile">'+Number(s.lessons_completed||0)+'</td><td class="hide-mobile">🔥 '+Number(s.streak||0)+'</td></tr>'
}).join('');
}
load();
})();
</script>
</body>
</html>
